<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Map - worldLow</title>
<script src="https://cdn.amcharts.com/lib/5/index.js"></script>
<script src="https://cdn.amcharts.com/lib/5/map.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/Dark.js"></script>
<script src="https://cdn.amcharts.com/lib/5/geodata/worldLow.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2d2d2d}#chartdiv{width:100%;height:100vh}</style>
</head>
<body>
<div id="chartdiv"></div>
<script>
am5.ready(function(){
  var root=am5.Root.new("chartdiv");
  root.setThemes([am5themes_Animated.new(root),am5themes_Dark.new(root)]);
  var chart=root.container.children.push(am5map.MapChart.new(root,{projection:am5map.geoEqualEarth(),panX:"rotateX",panY:"translateY"}));
  var series=chart.series.push(am5map.PixelMapSeries.new(root,{geoJSON:am5geodata_worldLow,pixelType:"diamond",step:0.9,pixelSize:0.5,uniform:true}));
  series.mapPolygons.template.setAll({fill:am5.color(0xc0c0c0),tooltipText:"{name}"});
  series.mapPolygons.template.states.create("hover",{fill:am5.color(0xff8080)});
  chart.set("zoomControl",am5map.ZoomControl.new(root,{}));
  chart.appear(1000,100);
});
</script>
</body>
</html>
